<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterOne Polo - অর্ডার করুন</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f8f9fa;">

<!-- Header -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid justify-content-center">
        <a class="navbar-brand" href="#">BetterOne Polo</a>
    </div>
</nav>

<!-- Product Section -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <img src="polo-shirt.jpg" class="card-img-top" alt="Polo Shirt">
                <div class="card-body text-center">
                    <h5 class="card-title">100% Export Spandex Polo</h5>
                    <p class="card-text text-danger fs-4">৳990</p>
                    <p class="card-text">ডেলিভারি চার্জ ফ্রি। হাতে পেয়ে চেক করে টাকা দিন।</p>
                    
                    <!-- Order Form -->
                    <form>
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="আপনার নাম" required>
                        </div>
                        <div class="mb-3">
                            <input type="tel" class="form-control" placeholder="মোবাইল নাম্বার" required>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" rows="3" placeholder="ডেলিভারি ঠিকানা" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">অর্ডার করুন</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
